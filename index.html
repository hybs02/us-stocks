<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="米国株">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>米国株判定</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2233; --card2:#141b2a; --line:#2a3550;
    --buy:#23c483; --sell:#ff5d6c; --neu:#8896b3;
    --text:#e8edf7; --sub:#9aa7c2; --accent:#ffcf4a;
    --buyBg:rgba(35,196,131,.14); --sellBg:rgba(255,93,108,.14); --accBg:rgba(255,207,74,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{margin:0 auto; background:var(--bg); color:var(--text); max-width:520px;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;}
  button,input,select{font:inherit; color:inherit;}
  .top{display:flex; align-items:center; gap:8px; margin:2px 0 10px;}
  .top h1{font-size:18px; margin:0; flex:1;}
  .top .upd{font-size:11px; color:var(--sub); text-align:right; line-height:1.3;}
  .iconbtn{border:1px solid var(--line); background:var(--card); border-radius:10px; min-width:40px; height:36px; font-weight:700;}
  .spin{display:inline-block; animation:spin 1s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
  .tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;}
  .tabs button{padding:10px 0; border:1px solid var(--line); background:var(--card); border-radius:10px; font-size:13px; font-weight:700;}
  .tabs button.on{background:var(--accent); color:#1a1300; border-color:var(--accent);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h2{font-size:14px; margin:0 0 8px; color:var(--accent); display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .card h2 small{font-size:11px; color:var(--sub); font-weight:600;}
  .regime{border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:13px; line-height:1.6;}
  .r-on{background:var(--buyBg); border:1px solid var(--buy);}
  .r-off{background:var(--sellBg); border:1px solid var(--sell);}
  .regime b.h{font-size:15px;}
  .r-on b.h{color:var(--buy);} .r-off b.h{color:#ffb3ba;}
  .note{font-size:12px; color:var(--sub); line-height:1.65;}
  .note b{color:var(--text);}
  .banner{background:var(--accBg); border:1px solid var(--accent); color:var(--accent); border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px;}
  .warn{background:var(--sellBg); border:1px solid var(--sell); color:#ffb3ba; border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px; font-weight:600;}
  .row{display:flex; align-items:center; gap:9px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer; min-height:50px;}
  .row:last-child{border-bottom:none;}
  .row:active{background:var(--card2);}
  .rk{flex:0 0 20px; text-align:center; font-size:12px; color:var(--sub); font-weight:700;}
  .tk{flex:0 0 64px; font-weight:800; font-size:14px; line-height:1.2;}
  .tk small{display:block; font-size:10.5px; color:var(--sub); font-weight:600;}
  .nm{flex:1; min-width:0; font-size:12px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nm b{color:var(--text); font-weight:600;}
  .sc{flex:0 0 auto; text-align:right; font-weight:800; font-size:15px; line-height:1.15;}
  .sc small{display:block; font-size:10.5px; font-weight:600; color:var(--sub);}
  .hi{color:var(--buy);} .mid{color:var(--accent);} .lo{color:var(--neu);}
  .plus{color:var(--buy);} .minus{color:var(--sell);}
  .chip{display:inline-block; font-size:11px; font-weight:800; padding:2px 7px; border-radius:7px; background:rgba(136,150,179,.18); color:var(--sub); margin-right:4px; white-space:nowrap;}
  .chip.buy{background:rgba(35,196,131,.22); color:var(--buy);}
  .chip.sell{background:rgba(255,93,108,.22); color:#ffb3ba;}
  .chip.acc{background:var(--accBg); color:var(--accent);}
  .grp{font-size:12px; font-weight:800; margin:12px 0 2px; padding-bottom:4px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between;}
  .grp.s{color:#ffb3ba;} .grp.b{color:var(--buy);} .grp.k{color:var(--sub);}
  .back{background:none; border:none; color:var(--accent); font-size:14px; font-weight:700; padding:8px 0; margin-bottom:4px;}
  .big{font-size:28px; font-weight:800;}
  .kv{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--sub);}
  .kv b{text-align:right;}
  .fac{display:flex; align-items:center; gap:8px; font-size:12px; margin:8px 0;}
  .fac .fl{flex:0 0 96px; color:var(--sub);}
  .fac .fb{flex:1; height:8px; background:#0c111c; border-radius:4px; overflow:hidden;}
  .fac .fb i{display:block; height:100%; background:var(--accent);}
  .fac .fv{flex:0 0 26px; text-align:right; color:var(--sub);}
  .hbars{display:flex; align-items:flex-end; gap:3px; height:64px; margin:6px 0 2px; position:relative;}
  .hbars i{flex:1; border-radius:3px 3px 0 0; background:#3a4763;}
  .hbars i.ok{background:var(--buy);}
  .hbars .line{position:absolute; left:0; right:0; border-top:1px dashed var(--accent); opacity:.7;}
  .hlab{display:flex; justify-content:space-between; font-size:10.5px; color:var(--sub);}
  .field{display:flex; align-items:center; gap:8px; margin:8px 0;}
  .field label{flex:0 0 116px; font-size:12.5px; color:var(--sub);}
  .field input,.field select{flex:1; min-width:0; padding:10px; border-radius:10px; border:1px solid var(--line); background:#0c111c; font-size:16px; font-weight:700;}
  .search{width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:#0c111c; font-size:16px; margin-bottom:10px;}
  .btn{display:block; width:100%; padding:13px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:#1a1300; font-weight:800; font-size:15px; margin-top:10px;}
  .btn.ghost{background:transparent; color:var(--accent);}
  .btn.red{background:transparent; color:#ffb3ba; border-color:var(--sell);}
  canvas{width:100%; display:block;}
  details.card > summary{cursor:pointer; color:var(--accent); font-weight:700; list-style:none; display:flex; justify-content:space-between;}
  details.card > summary::after{content:"＋"; color:var(--sub);}
  details.card[open] > summary::after{content:"－";}
  details.card > summary::-webkit-details-marker{display:none;}
  details.card[open] > summary{margin-bottom:8px;}
  .foot{font-size:11px; color:var(--sub); text-align:center; margin-top:10px; line-height:1.7;}
  .loading{text-align:center; padding:40px 0; color:var(--sub);}
</style>
</head>
<body>
  <div class="top">
    <h1>米国株判定</h1>
    <div class="upd" id="upd"></div>
    <button class="iconbtn" id="refresh" aria-label="更新">↻</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-v="todo" class="on">やること</button>
    <button data-v="cand">候補</button>
    <button data-v="hold">保有</button>
    <button data-v="find">探す</button>
  </div>
  <div id="app"><div class="loading">読み込み中…</div></div>
  <div class="foot">1日4回（米国の取引中と引け後）自動で計算し直しています・APIキー不要<br>※参考情報です。最終判断は自己責任で。</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const app = () => $("#app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// よく知られた銘柄の日本語名（検索と表示用）
const JA = {AAPL:"アップル",MSFT:"マイクロソフト",NVDA:"エヌビディア",AMZN:"アマゾン",GOOGL:"アルファベット（グーグル）",GOOG:"アルファベット（グーグル）",
  META:"メタ（フェイスブック）",TSLA:"テスラ",AVGO:"ブロードコム","BRK-B":"バークシャー・ハサウェイ",JPM:"JPモルガン",V:"ビザ",MA:"マスターカード",
  UNH:"ユナイテッドヘルス",XOM:"エクソンモービル",JNJ:"ジョンソン・エンド・ジョンソン",PG:"P&G",HD:"ホーム・デポ",COST:"コストコ",LLY:"イーライリリー",
  ABBV:"アッヴィ",MRK:"メルク",KO:"コカ・コーラ",PEP:"ペプシコ",WMT:"ウォルマート",BAC:"バンク・オブ・アメリカ",NFLX:"ネットフリックス",ADBE:"アドビ",
  CRM:"セールスフォース",ORCL:"オラクル",AMD:"AMD",INTC:"インテル",CSCO:"シスコ",QCOM:"クアルコム",TXN:"テキサス・インスツルメンツ",IBM:"IBM",
  DIS:"ディズニー",NKE:"ナイキ",MCD:"マクドナルド",SBUX:"スターバックス",BA:"ボーイング",CAT:"キャタピラー",GE:"GEエアロスペース",GEV:"GEベルノバ",
  MMM:"スリーエム",HON:"ハネウェル",LMT:"ロッキード・マーチン",RTX:"RTX（レイセオン）",GS:"ゴールドマン・サックス",MS:"モルガン・スタンレー",
  C:"シティグループ",WFC:"ウェルズ・ファーゴ",AXP:"アメリカン・エキスプレス",PYPL:"ペイパル",T:"AT&T",VZ:"ベライゾン",CVX:"シェブロン",PFE:"ファイザー",
  TMO:"サーモフィッシャー",ABT:"アボット",AMGN:"アムジェン",GILD:"ギリアド",MU:"マイクロン",AMAT:"アプライド・マテリアルズ",LRCX:"ラムリサーチ",
  KLAC:"KLA",UBER:"ウーバー",ABNB:"エアビーアンドビー",BKNG:"ブッキング",PLTR:"パランティア",CRWD:"クラウドストライク",PANW:"パロアルトネットワークス",
  NOW:"サービスナウ",INTU:"インテュイット",SNPS:"シノプシス",CDNS:"ケイデンス",DELL:"デル",HPQ:"HP",HPE:"ヒューレット・パッカード・エンタープライズ",
  F:"フォード",GM:"ゼネラル・モーターズ",UPS:"UPS",FDX:"フェデックス",LOW:"ロウズ",TGT:"ターゲット",CMG:"チポトレ",MDLZ:"モンデリーズ",MO:"アルトリア",
  PM:"フィリップ・モリス",CL:"コルゲート",SPGI:"S&Pグローバル",BLK:"ブラックロック",SCHW:"チャールズ・シュワブ",DE:"ディア",UNP:"ユニオン・パシフィック",
  NEE:"ネクステラ・エナジー",DUK:"デューク・エナジー",SO:"サザン",AMT:"アメリカン・タワー",PLD:"プロロジス",ANET:"アリスタ・ネットワークス",
  SMCI:"スーパー・マイクロ",MRNA:"モデルナ",CVS:"CVSヘルス",ISRG:"インテュイティブ・サージカル",VRTX:"バーテックス",REGN:"リジェネロン",
  BMY:"ブリストル・マイヤーズ",ZTS:"ゾエティス",SNDK:"サンディスク",STX:"シーゲイト",WDC:"ウエスタンデジタル",MRVL:"マーベル",ADI:"アナログ・デバイセズ",
  NXPI:"NXP",ON:"オン・セミコンダクター",APP:"アップラビン",COIN:"コインベース",HOOD:"ロビンフッド",DASH:"ドアダッシュ",RDDT:"レディット",
  LULU:"ルルレモン",DPZ:"ドミノ・ピザ",YUM:"ヤム・ブランズ",KHC:"クラフト・ハインツ",HSY:"ハーシー",ADP:"ADP",ACN:"アクセンチュア",FTNT:"フォーティネット",
  MPC:"マラソン・ペトロリアム",COP:"コノコフィリップス",OXY:"オキシデンタル",SLB:"SLB（シュルンベルジェ）",VST:"ビストラ",CEG:"コンステレーション・エナジー",
  NEM:"ニューモント",FCX:"フリーポート・マクモラン",LIN:"リンデ",SHW:"シャーウィン・ウィリアムズ",EBAY:"イーベイ",ETSY:"エッツィ",EXPE:"エクスペディア",
  MAR:"マリオット",HLT:"ヒルトン",WBD:"ワーナー・ブラザース・ディスカバリー",CMCSA:"コムキャスト",TMUS:"Tモバイル",CHTR:"チャーター",
  ORLY:"オライリー",AZO:"オートゾーン",TJX:"TJX",ROST:"ロス・ストアーズ",KR:"クローガー",DG:"ダラー・ジェネラル",BBY:"ベスト・バイ"};

let DATA = null, CHART = null;
// 結果は自動更新が専用の枝（data）に上書きする。リポジトリの履歴を膨らませないため
const RAW = "https://raw.githubusercontent.com/hybs02/us-stocks/data/";
async function getJson(name, bust){
  let err = null;
  for(const u of [RAW + name, name]){
    try{ const r = await fetch(u + "?t=" + bust, {cache:"no-store"}); if(r.ok) return await r.json(); err = new Error(name + " " + r.status); }
    catch(e){ err = e; }
  }
  throw err;
}
let balance = +store.get("us_bal", 0) || 0;
let K = +store.get("us_k", 10) || 10;
let hold = store.get("us_hold", null);
if(!hold){ hold = (store.get("us_held", []) || []).map(t => ({t, sh:0, cost:0})); store.set("us_hold", hold); }   // 旧形式から移す
let view = store.get("us_view", "todo"), sel = null, query = "", loading = false, lastFetch = 0;
let done = store.get("us_done", "");      // 見直しを済ませた月末（例 "2026-08-31"）

const byT = t => DATA.stocks.find(s => s.t === t);
const usd = v => "$" + (+v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const yen = v => (v < 0 ? "-¥" : "¥") + Math.abs(Math.round(v)).toLocaleString();
const sgn = v => (v > 0 ? "+" : "") + v;
const cls = s => s == null ? "lo" : s >= 70 ? "hi" : s >= 50 ? "mid" : "lo";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const W = ["日","月","火","水","木","金","土"];
function jd(iso){ if(!iso) return "—"; const [y,m,d] = iso.split("-").map(Number); return `${m}/${d}(${W[new Date(Date.UTC(y,m-1,d)).getUTCDay()]})`; }
const mo = iso => +iso.slice(5,7) + "月";
const rate = () => DATA.usdjpy || 150;
const nameOf = s => JA[s.t] ? `${JA[s.t]}` : s.n;

async function load(){
  if(loading) return; loading = true; $("#refresh").innerHTML = '<span class="spin">↻</span>';
  try{
    DATA = await getJson("data.json", Date.now()); lastFetch = Date.now(); CHART = null;
    try{ localStorage.setItem("us_cache", JSON.stringify(DATA)); }catch(e){}
    render();
  }catch(e){
    if(!DATA) app().innerHTML = `<div class="warn">データを読み込めませんでした（${esc(e.message)}）。通信を確認して ↻ を押してください。</div>`;
    else $("#upd").innerHTML = '<span style="color:var(--sell)">通信できず前回の値</span>';
  }finally{ loading = false; $("#refresh").textContent = "↻"; }
}
async function loadChart(){
  if(CHART) return CHART;
  try{ CHART = await getJson("chart.json", DATA.updated.replace(/\D/g, "")); }catch(e){}
  return CHART;
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && Date.now() - lastFetch > 10*60e3) load(); });

// ================= 今月の見直し（ここ1か所で決める） =================
// 月末の点数で：持ち株のうち 70 未満は売る → 空いた枠を、70以上・200日線の上・地雷なしの銘柄で
// 点数順に埋める（同じ業種5つ・同じ細かい業種2つまで）。S&P500 が月末に 200日線の下なら新規は止める。
function plan(){
  const R = DATA.rule, M = DATA.market;
  const sells = [], keeps = [], buys = [];
  const sec = {}, sub = {};
  hold.forEach(h => {
    const s = byT(h.t);
    if(!s){ sells.push({h, s:null, why:"S&P500から外れた（買収・入れ替えなど）"}); return; }
    if(s.me == null || s.me < R.buyMin){ sells.push({h, s, why:`${mo(DATA.monthEnd)}末の点数が${s.me ?? "—"}点（70未満）`}); return; }
    keeps.push({h, s}); sec[s.sec] = (sec[s.sec] || 0) + 1; sub[s.sub] = (sub[s.sub] || 0) + 1;
  });
  const slots = Math.max(0, K - keeps.length);
  if(M.onMe && slots){
    const held = new Set(hold.map(h => h.t));
    const cands = DATA.stocks.filter(s => s.elig && !held.has(s.t)).sort((a, b) => b.me - a.me);
    for(const s of cands){
      if(buys.length >= slots) break;
      if((sec[s.sec] || 0) >= R.sectorCap || (sub[s.sub] || 0) >= R.subCap) continue;
      buys.push(s); sec[s.sec] = (sec[s.sec] || 0) + 1; sub[s.sub] = (sub[s.sub] || 0) + 1;
    }
  }
  return {sells, keeps, buys, slots};
}
function sharesFor(s){ if(!(balance > 0)) return null; return Math.floor(balance / K / (s.px * rate())); }

// ================= 描画 =================
function render(){
  if(!DATA) return;
  $("#upd").textContent = DATA.updated.slice(5).replace("-", "/") + " 更新";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  if(sel) return renderDetail(sel);
  ({todo:renderTodo, cand:renderCand, hold:renderHold, find:renderFind}[view] || renderTodo)();
}
function regimeBox(){
  const M = DATA.market;
  const now = M.onNow === M.onMe ? "" : `<br><span class="note">いま（${jd(DATA.asof)}）は S&P500 が200日線の${M.onNow ? "上" : "下"}（${sgn(M.devNow)}%）。次の月末に${M.onNow ? "上" : "下"}なら${M.onNow ? "新規の買いを再開" : "新規を止める"}。</span>`;
  return `<div class="regime ${M.onMe ? "r-on" : "r-off"}">
    <b class="h">${M.onMe ? "● 新しく買ってよい月" : "▲ 今月は新しく買わない"}</b><br>
    ${mo(DATA.monthEnd)}末の S&P500 は200日線の${M.onMe ? "上" : "下"}（${sgn(M.devMe)}%）。${M.onMe ? "" : "持ち株は70点のルールどおりに。空いた枠は現金で待つ。"}${now}
    <div class="note" style="margin-top:4px;">検証（20年）では、200日線の下で新規を止めると年率はほぼ同じで、最大の下落が−58%→−33%に縮みました。</div></div>`;
}
function row(s, rk, extra){
  const d = s.score - (s.prev ?? s.score);
  return `<div class="row" data-t="${s.t}">
    ${rk != null ? `<div class="rk">${rk}</div>` : ""}
    <div class="tk">${s.t}<small>${usd(s.px)}</small></div>
    <div class="nm"><b>${esc(nameOf(s))}</b><br>${extra || esc(s.secJa)}</div>
    <div class="sc ${cls(s.me ?? s.score)}">${s.me ?? "—"}<small>いま ${s.score}${d ? (d > 0 ? " ↑" : " ↓") : ""}</small></div></div>`;
}
function reviewHead(){
  const nx = DATA.nextMonthEnd;
  return `<div class="note">使うのは<b>${mo(DATA.monthEnd)}末（${jd(DATA.monthEnd)}）の点数</b>。次の見直しは ${jd(nx)} の終値 → 日本時間の翌朝に更新。
    月の途中で70点を割っても、月末に戻れば持ち続けます（毎週見直すより月1回の方が成績が良かった）。</div>`;
}
// 月末から何日たったか（見直しは月初めに1回の前提で検証している）
function daysSinceMonthEnd(){ return Math.round((Date.now() - Date.parse(DATA.monthEnd + "T21:00:00Z")) / 86400e3); }
function lateNote(){
  const d = daysSinceMonthEnd();
  if(d <= 7) return "";
  return `<div class="banner">${mo(DATA.monthEnd)}末から${d}日たっています。規則は「月初めに見直して、次の月末まで動かない」前提で検証しました。
    これから始める・見直すなら、次の見直し（${jd(DATA.nextMonthEnd)}の終値の翌朝）まで待つと規則どおりになります。</div>`;
}
function renderTodo(){
  const P = plan(), M = DATA.market;
  let html = regimeBox();
  if(hold.length && done === DATA.monthEnd){
    const warn = P.keeps.filter(x => x.s.score < 70);
    html += `<div class="card"><h2>✔ ${mo(DATA.monthEnd)}末の見直しは済み</h2>

function renderHold(){

    const val = h.sh * s.px, pl = h.cost > 0 && h.sh > 0 ? (s.px - h.cost) * h.sh : null;

    return row(s, null, `${st}${h.sh ? `${h.sh}株` : ""}${pl != null ? ` <b class="${pl >= 0 ? "plus" : "minus"}">${sgn((pl / (h.cost * h.sh) * 100).toFixed(1))}%</b>` : ""}`);
  }).join("");
  const plTot = totCost > 0 ? tot - hold.reduce((a, h) => { const s = byT(h.t); return a + (s && h.cost > 0 ? h.sh * s.px : 0); }, 0) : 0;

function renderFind(){
  app().innerHTML = `<input class="search" id="q" placeholder="ティッカー・会社名（例 AAPL / apple / アップル）" value="${esc(query)}" autocomplete="off">
    <div class="card" id="res"></div>`;
  const q = $("#q");
  const draw = () => {
    query = q.value.trim();
    const Q = query.toLowerCase();
    // 並び：ティッカー完全一致 → ティッカーの頭 → 名前の頭 → 名前のどこか（同じ組は点数順）
    const rank = s => { const t = s.t.toLowerCase(), n = s.n.toLowerCase(), j = JA[s.t] || "";
      if(t === Q) return 0; if(t.startsWith(Q)) return 1;
      if(n.startsWith(Q) || j.startsWith(query) || n.split(/[\s,.]+/).some(w => w.startsWith(Q))) return 2;
      if(n.includes(Q) || j.includes(query)) return 3; return 9; };
    const list = !Q ? DATA.stocks.slice(0, 40)
      : DATA.stocks.map(s => [rank(s), s]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || b[1].score - a[1].score).map(x => x[1]).slice(0, 60);
    $("#res").innerHTML = `<h2>${Q ? `「${esc(query)}」の結果` : "いまの点数が高い順"} <small>${list.length}件</small></h2>` +
      (list.map(s => row(s, null, `${s.elig ? '<span class="chip buy">買える</span>' : (s.me != null && s.me < 70 ? "" : "")}${esc(s.secJa)}`)).join("") || `<div class="note">見つかりません（S&P500の銘柄だけを扱っています）。</div>`);
    bindRows();
  };
  q.addEventListener("input", draw); draw();
  if(!query) setTimeout(() => q.focus(), 50);
}
function bindRows(){

function drawChart(d, v){
  const cv = $("#cv"); if(!cv) return;
  const dpr = window.devicePixelRatio || 1, Wd = cv.clientWidth, Ht = 170;
  cv.width = Wd * dpr; cv.height = Ht * dpr; cv.style.height = Ht + "px";
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const pts = v.map((y, i) => [i, y]).filter(p => p[1] != null);
  if(pts.length < 2) return;
  const ys = pts.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * 0.08 || 1;
  const L = 4, R = 56, T = 8, B = 150, N = v.length;
  const x = i => L + (Wd - L - R) * i / (N - 1), y = val => T + (B - T) * (1 - (val - lo + pad) / (hi - lo + 2 * pad));
  g.font = "11px sans-serif"; g.strokeStyle = "#2a3550"; g.fillStyle = "#9aa7c2";
  [lo, (lo + hi) / 2, hi].forEach(val => { g.beginPath(); g.moveTo(L, y(val)); g.lineTo(Wd - R, y(val)); g.stroke(); g.fillText("$" + val.toFixed(val < 100 ? 2 : 0), Wd - R + 4, y(val) + 4); });
  const up = ys[ys.length - 1] >= ys[0];
  g.strokeStyle = up ? "#23c483" : "#ff5d6c"; g.lineWidth = 2; g.beginPath();
  pts.forEach((p, k) => k ? g.lineTo(x(p[0]), y(p[1])) : g.moveTo(x(p[0]), y(p[1]))); g.stroke();
  g.fillStyle = "#9aa7c2"; g.fillText(jd(d[0]), L, Ht - 4); g.textAlign = "right"; g.fillText(jd(d[N - 1]), Wd - R, Ht - 4);
}
